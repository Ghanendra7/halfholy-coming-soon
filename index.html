<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HALF HOLY — Coming Soon</title>
  <meta name="description" content="Halfholy. Coming Soon. New York.">
  <meta property="og:title" content="HALF HOLY — Coming Soon">
  <meta property="og:description" content="Halfholy. New York.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://halfholy.nyc">
  <meta name="theme-color" content="#0a0a0a">

  <style>
    @font-face {
      font-family: 'Antique Legacy';
      src: url('./assets/fonts/AntiqueLegacy-Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Fragment Mono';
      src: url('./assets/fonts/FragmentMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-serif: 'Antique Legacy', Didot, 'Times New Roman', serif;
      --font-mono: 'Fragment Mono', 'SF Mono', Menlo, Consolas, monospace;
      --bg-color: #080808;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.2);
      --border-active: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-mono);
      overflow: hidden;
      position: relative;
    }

    /* Video Background */
    .video-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background-color: #000;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: brightness(0.85) contrast(1.05);
      transition: filter 0.6s ease;
    }

    /* Subtle Cinematic Vignette */
    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at center, rgba(8, 8, 8, 0.15) 0%, rgba(8, 8, 8, 0.65) 100%),
                  linear-gradient(to bottom, rgba(8, 8, 8, 0.5) 0%, transparent 25%, transparent 75%, rgba(8, 8, 8, 0.6) 100%);
      pointer-events: none;
    }

    /* Page Layout Container */
    .content-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.25rem, 4vw, 3rem);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand-logo {
      font-family: var(--font-serif);
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 300;
      transition: opacity 0.3s ease;
    }

    .brand-logo:hover {
      opacity: 0.75;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: clamp(0.7rem, 1vw, 0.78rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sound-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: clamp(0.68rem, 0.9vw, 0.75rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .sound-btn:hover {
      border-color: var(--border-active);
      background-color: rgba(255, 255, 255, 0.12);
    }

    .sound-wave {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }

    .sound-wave span {
      display: block;
      width: 2px;
      height: 3px;
      background-color: currentColor;
      transition: height 0.2s ease;
    }

    .sound-wave.active span:nth-child(1) {
      animation: pulse 0.7s infinite alternate ease-in-out;
    }
    .sound-wave.active span:nth-child(2) {
      animation: pulse 0.9s infinite alternate 0.2s ease-in-out;
    }
    .sound-wave.active span:nth-child(3) {
      animation: pulse 0.6s infinite alternate 0.4s ease-in-out;
    }

    @keyframes pulse {
      0% { height: 2px; }
      100% { height: 10px; }
    }

    /* Main Center Content */
    main {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }

    .kicker {
      font-size: clamp(0.7rem, 1vw, 0.8rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .headline {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5.5vw, 4.25rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 2rem;
      color: var(--text-main);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    }

    /* Newsletter Form */
    .signup-form {
      width: 100%;
      max-width: 380px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.5rem;
      transition: border-color 0.3s ease;
      position: relative;
    }

    .signup-form:focus-within {
      border-color: var(--border-active);
    }

    .signup-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: clamp(0.75rem, 1vw, 0.82rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding-right: 1rem;
    }

    .signup-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .signup-submit {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      letter-spacing: 0.1em;
      opacity: 0.65;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .signup-submit:hover {
      opacity: 1;
      transform: translateX(3px);
    }

    .form-message {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      margin-top: 0.75rem;
      text-transform: uppercase;
      min-height: 1.2rem;
      transition: opacity 0.3s ease;
    }

    .form-message.success {
      color: #bbf7d0;
    }

    .form-message.error {
      color: #fca5a5;
    }

    /* Footer */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      font-size: clamp(0.68rem, 0.9vw, 0.75rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    footer a:hover {
      color: var(--text-main);
    }

    .footer-left, .footer-center, .footer-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Responsive Adjustments */
    @media (max-width: 640px) {
      .header-meta .location-tag {
        display: none;
      }

      footer {
        flex-direction: column;
        gap: 0.75rem;
        text-align: center;
      }

      .footer-left, .footer-center, .footer-right {
        gap: 1rem;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Ambient Background Video -->
  <div class="video-container">
    <video id="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="./assets/poster.jpg">
      <source src="./assets/coming_soon.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Page Overlay Content -->
  <div class="content-wrapper">
    <!-- Top Header -->
    <header>
      <a href="/" class="brand-logo">HALF HOLY</a>

      <div class="header-meta">
        <span class="location-tag">NEW YORK</span>
        <button id="sound-toggle" class="sound-btn" type="button" aria-label="Toggle Sound">
          <div class="sound-wave" id="sound-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span id="sound-label">SOUND</span>
        </button>
      </div>
    </header>

    <!-- Center Stage: Coming Soon -->
    <main>
      <p class="kicker">COLLECTION 01</p>
      <h1 class="headline">COMING SOON</h1>

      <!-- Early Access Signup -->
      <form id="signup-form" class="signup-form" autocomplete="off">
        <input 
          type="email" 
          id="email-input" 
          class="signup-input" 
          placeholder="ENTER YOUR EMAIL FOR EARLY ACCESS" 
          required
          aria-label="Email Address"
        >
        <button type="submit" class="signup-submit" aria-label="Submit">
          &rarr;
        </button>
      </form>
      <div id="form-msg" class="form-message"></div>
    </main>

    <!-- Bottom Footer -->
    <footer>
      <div class="footer-left">
        <span>&copy; 2026 HALF HOLY</span>
      </div>

      <div class="footer-center">
        <a href="mailto:info@halfholy.nyc">INFO@HALFHOLY.NYC</a>
      </div>

      <div class="footer-right">
        <a href="https://instagram.com" target="_blank" rel="noopener">INSTAGRAM</a>
      </div>
    </footer>
  </div>

  <script>
    // Audio Toggle Handler
    const video = document.getElementById('bg-video');
    const soundToggle = document.getElementById('sound-toggle');
    const soundLabel = document.getElementById('sound-label');
    const soundIndicator = document.getElementById('sound-indicator');

    soundToggle.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        soundLabel.textContent = 'MUTE';
        soundIndicator.classList.add('active');
      } else {
        video.muted = true;
        soundLabel.textContent = 'SOUND';
        soundIndicator.classList.remove('active');
      }
    });

    // Handle Autoplay policy safety
    document.addEventListener('DOMContentLoaded', () => {
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Fallback if browser blocks unmuted or initial play
          video.muted = true;
          video.play().catch(() => {});
        });
      }
    });

    // Early Access Newsletter Handler
    const form = document.getElementById('signup-form');
    const emailInput = document.getElementById('email-input');
    const msg = document.getElementById('form-msg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (!email || !email.includes('@')) {
        msg.textContent = 'PLEASE ENTER A VALID EMAIL';
        msg.className = 'form-message error';
        return;
      }

      // Store locally in localStorage (can be extracted or hooked to a webhook/Klaviyo)
      try {
        const stored = JSON.parse(localStorage.getItem('halfholy_waitlist') || '[]');
        if (!stored.includes(email)) {
          stored.push(email);
          localStorage.setItem('halfholy_waitlist', JSON.stringify(stored));
        }
      } catch (err) {}

      // Confirmation feedback
      msg.textContent = 'YOU HAVE BEEN ADDED TO EARLY ACCESS';
      msg.className = 'form-message success';
      emailInput.value = '';
      emailInput.disabled = true;

      setTimeout(() => {
        msg.style.opacity = '0';
      }, 5000);
    });
  </script>
</body>
</html>
