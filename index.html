  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">

  <style>
    @font-face {
      font-family: 'Fragment Mono';
      src: url('./assets/fonts/FragmentMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-mono: 'Fragment Mono', monospace, -apple-system, BlinkMacSystemFont, sans-serif;
      --color-white: #FFFFFF;

      --status-font-size: 9px;
      --status-line-height: 1.15;
      --status-letter-spacing: 0.2em;
      --top-items-gap: 30px;
      --logo-width: 62px;

      --logo-fade-delay: 0.1s;
      --logo-fade-duration: 0.4s;
      --anim-delay: 1.2s;
      --anim-duration: 4s;
      --anim-ease: cubic-bezier(0.83, 0, 0, 1);

      --mobile-video-padding-y: 15vh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-synthesis: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: var(--color-white);
      font-family: var(--font-mono);
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "tnum" 1;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .video-viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000000 url('./assets/poster.jpg') no-repeat center center;
      background-size: auto 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-viewport video {
      height: 100vh;
      height: 100dvh;
      width: auto;
      max-width: none;
      display: block;
      pointer-events: none;
    }

    video::-webkit-media-controls,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    .video-viewport video::-webkit-media-controls,
    .video-viewport video::-webkit-media-controls-start-playback-button,
    .video-viewport video::-webkit-media-controls-play-button,
    .video-viewport video::-webkit-media-controls-overlay-play-button,
    .video-viewport video::-webkit-media-controls-enclosure,
    .video-viewport video::-webkit-media-controls-panel {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    @media (max-width: 768px) {
      .video-viewport {
        inset: var(--mobile-video-padding-y) 0;
        height: auto;
        background-size: cover;
      }

      .video-viewport video {
        width: 100%;
        height: 100%;
        max-width: 100%;
        object-fit: cover;
        object-position: center;
      }
    }

    .overlay-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      pointer-events: none;
    }

    .top-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--top-items-gap);
      font-size: var(--status-font-size);
      line-height: var(--status-line-height);
      letter-spacing: var(--status-letter-spacing);
      text-transform: uppercase;
      text-align: center;
      color: var(--color-white);
      font-family: var(--font-mono);
      font-weight: 400;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "tnum" 1;
      font-variant-numeric: tabular-nums lining-nums;
      white-space: nowrap;
    }

    .center-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .logo-stage {
      position: relative;
      width: var(--logo-width);
      height: calc(var(--logo-width) * 8 / 62);
      display: block;
    }

    .logo-letter {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: translate3d(var(--dx, 0px), 0, 0);
      will-change: transform, opacity;
      opacity: 0;
      transition: opacity var(--logo-fade-duration) ease-in var(--logo-fade-delay);
    }

    .logo-letter.ready {
      opacity: 1;
    }

    .logo-letter.animate-shrink {
      animation: shrinkLetterToLogo var(--anim-duration) var(--anim-ease) var(--anim-delay) forwards;
    }

    @keyframes shrinkLetterToLogo {
      0% {
        transform: translate3d(var(--dx, 0px), 0, 0);
      }

      100% {
        transform: translate3d(0, 0, 0);
      }
    }

    .logo-letter svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .bottom-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--top-items-gap);
      font-size: var(--status-font-size);
      line-height: var(--status-line-height);
      letter-spacing: var(--status-letter-spacing);
      text-transform: uppercase;
      text-align: center;
      color: var(--color-white);
      font-family: var(--font-mono);
      font-weight: 400;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "tnum" 1;
      white-space: nowrap;
    }

    .bottom-status a,
    .bottom-status a:visited,
    .bottom-status a:hover,
    .bottom-status a:active,
    .bottom-status a:focus {
      color: var(--color-white);
      text-decoration: none;
      cursor: pointer;
      pointer-events: auto;
      transition: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

  <script>

    function updateNYCTime() {
      try {
        const now = new Date();
        const timeFmt = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
        const dateFmt = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });

        const timeEl = document.getElementById('nyc-time');
        const dateEl = document.getElementById('nyc-date');

        if (timeEl) timeEl.textContent = timeFmt.format(now);
        if (dateEl) dateEl.textContent = dateFmt.format(now);
      } catch (err) { }
    }

    updateNYCTime();
    setInterval(updateNYCTime, 1000);

    function setupLogoAnimation() {
      const stage = document.getElementById('logo-stage');
      const letters = document.querySelectorAll('.logo-letter');
      if (!stage || !letters.length) return;

      const pathX = [0.000, 8.500, 16.939, 24.294, 31.502, 40.273, 48.173, 54.455];
      const pathW = [7.632, 7.563, 6.140, 6.025, 7.632, 6.760, 6.140, 7.184];
      const P = 16;

      function computeAndPlay() {
        letters.forEach((letter) => letter.classList.remove('animate-shrink'));

        const rect = stage.getBoundingClientRect();
        const W = window.innerWidth;
        const scale = rect.width / 62;
        const logoLeft = rect.left;

        const lastLetterW = pathW[7] * scale;
        const spreadSpan = Math.max(0, W - (2 * P) - lastLetterW);
        const spreadStep = spreadSpan / 7;

        letters.forEach((letter, i) => {
          const compactX = logoLeft + (pathX[i] * scale);
          const spreadX = P + (i * spreadStep);
          const dx = spreadX - compactX;

          letter.style.setProperty('--dx', `${dx.toFixed(2)}px`);
        });

        requestAnimationFrame(() => {
          letters.forEach((letter) => letter.classList.add('ready'));
          requestAnimationFrame(() => {
            letters.forEach((letter) => letter.classList.add('animate-shrink'));
          });
        });
      }

      computeAndPlay();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          computeAndPlay();
        }, 150);
      });
    }

    if (document.readyState === 'complete') {
      setupLogoAnimation();
    } else {
      window.addEventListener('load', setupLogoAnimation);
    }

    const video = document.getElementById('bg-video');
    if (video) {
      video.defaultMuted = true;
      video.muted = true;
      video.playsInline = true;
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          const forcePlay = () => {
            video.play();
            document.removeEventListener('click', forcePlay);
            document.removeEventListener('touchstart', forcePlay);
          };
          document.addEventListener('click', forcePlay, { once: true, passive: true });
          document.addEventListener('touchstart', forcePlay, { once: true, passive: true });
        });
      }
    }
  </script>
</body>

</html>
