<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="Halfholy. New York.">
  <meta property="og:title" content="HALF HOLY — Coming Soon">
  <meta property="og:description" content="Halfholy. New York.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://halfholy.nyc">
  <meta name="theme-color" content="#000000">

  <style>
    @font-face {
      font-family: 'Fragment Mono';
      src: url('./assets/fonts/FragmentMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-mono: 'Fragment Mono', monospace, -apple-system, BlinkMacSystemFont, sans-serif;
      --color-white: #FFFFFF;

      --status-font-size: 9px;
      --status-line-height: 1.15;
      --status-letter-spacing: 0.2em;
      --top-items-gap: 30px;
      --logo-width: 85px;

      --logo-fade-delay: 0.1s;
      --logo-fade-duration: 0.4s;
      --anim-delay: 1.2s;
      --anim-duration: 4s;
      --anim-ease: cubic-bezier(0.83, 0, 0, 1);

      --mobile-video-padding-y: 15vh;

    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-synthesis: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: var(--color-white);
      font-family: var(--font-mono);
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "tnum" 1;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .video-viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-viewport video {
      height: 100vh;
      height: 100dvh;
      width: auto;
      max-width: none;
      display: block;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .video-viewport {
        inset: var(--mobile-video-padding-y) 0;
        height: auto;
      }

      .video-viewport video {
        width: 100%;
        height: 100%;
        max-width: 100%;
        object-fit: cover;
        object-position: center;
      }
    }

    .overlay-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      pointer-events: none;
    }

    .top-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--top-items-gap);
      font-size: var(--status-font-size);
      line-height: var(--status-line-height);
      letter-spacing: var(--status-letter-spacing);
      text-transform: uppercase;
      text-align: center;
      color: var(--color-white);
      font-family: var(--font-mono);
      font-weight: 400;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "tnum" 1;
      font-variant-numeric: tabular-nums lining-nums;
      white-space: nowrap;
    }

    .center-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .logo-stage {
      position: relative;
      width: var(--logo-width);
      height: calc(var(--logo-width) * 8 / 85);
      display: block;
    }

    .logo-letter {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: translate3d(var(--dx, 0px), 0, 0);
      will-change: transform, opacity;
      opacity: 0;
      transition: opacity var(--logo-fade-duration) ease-in var(--logo-fade-delay);
    }

    .logo-letter.ready {
      opacity: 1;
    }

    .logo-letter.animate-shrink {
      animation: shrinkLetterToLogo var(--anim-duration) var(--anim-ease) var(--anim-delay) forwards;
    }

    @keyframes shrinkLetterToLogo {
      0% {
        transform: translate3d(var(--dx, 0px), 0, 0);
      }

      100% {
        transform: translate3d(0, 0, 0);
      }
    }

    .logo-letter svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }

    .bottom-status {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--status-font-size);
      line-height: var(--status-line-height);
      letter-spacing: var(--status-letter-spacing);
      text-transform: uppercase;
      text-align: center;
      color: var(--color-white);
      font-family: var(--font-mono);
      font-weight: 400;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "tnum" 1;
      white-space: nowrap;
    }
  </style>
</head>

  <script>

    function updateNYCTime() {
      try {
        const now = new Date();
        const timeFmt = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
        const dateFmt = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });

        const timeEl = document.getElementById('nyc-time');
        const dateEl = document.getElementById('nyc-date');

        if (timeEl) timeEl.textContent = timeFmt.format(now);
        if (dateEl) dateEl.textContent = dateFmt.format(now);
      } catch (err) { }
    }

    updateNYCTime();
    setInterval(updateNYCTime, 1000);

    function setupLogoAnimation() {
      const stage = document.getElementById('logo-stage');
      const letters = document.querySelectorAll('.logo-letter');
      if (!stage || !letters.length) return;

      const pathX = [0.000, 8.501, 16.941, 24.296, 37.828, 51.948, 65.198, 76.830];
      const pathW = [7.633, 7.564, 6.141, 6.026, 7.633, 6.760, 6.141, 7.185];
      const P = 16;

      function computeAndPlay() {
        const rect = stage.getBoundingClientRect();
        const W = window.innerWidth;
        const scale = rect.width / 85;
        const logoLeft = rect.left;

        const lastLetterW = pathW[7] * scale;
        const spreadSpan = Math.max(0, W - (2 * P) - lastLetterW);
        const spreadStep = spreadSpan / 7;

        letters.forEach((letter, i) => {
          const compactX = logoLeft + (pathX[i] * scale);
          const spreadX = P + (i * spreadStep);
          const dx = spreadX - compactX;

          letter.style.setProperty('--dx', `${dx.toFixed(2)}px`);
        });

        requestAnimationFrame(() => {
          letters.forEach((letter) => letter.classList.add('ready'));
          requestAnimationFrame(() => {
            letters.forEach((letter) => letter.classList.add('animate-shrink'));
          });
        });
      }

      computeAndPlay();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          computeAndPlay();
        }, 150);
      });
    }

    if (document.readyState === 'complete') {
      setupLogoAnimation();
    } else {
      window.addEventListener('load', setupLogoAnimation);
    }

    const video = document.getElementById('bg-video');
    if (video) {
      video.muted = true;
      video.play().catch(() => {
        document.addEventListener('click', () => video.play(), { once: true });
        document.addEventListener('touchstart', () => video.play(), { once: true });
      });
    }
  </script>
